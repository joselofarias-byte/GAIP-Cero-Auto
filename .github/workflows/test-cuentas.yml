name: Pruebas de importacion de cuentas
on:
  push:
    branches:
      - feature/cuentas-inventario-importacion-es
  pull_request:
    paths:
      - 'herramientas/cuentas_importar.py'
      - 'tests/test_cuentas_importar.py'
      - '.github/workflows/test-cuentas.yml'
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxis
        run: python -m py_compile herramientas/cuentas_importar.py tests/test_cuentas_importar.py
      - name: Pruebas
        run: python -m unittest discover -s tests -p 'test_cuentas_importar.py' -v
